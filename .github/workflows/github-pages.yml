name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# least privilege (review 2026-11-25): the build job runs every dev dependency, so it only reads; the rights to publish
# the page belong to the deploy job alone, which runs no code of ours
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

# build and deploy are two jobs (the mykplan-adp shape): deploy-pages@v5 did not find the artifact that
# upload-pages-artifact@v5 had just uploaded in the same job, three runs in a row on 2026-11-24
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      # a third-party action: pinned to the commit of its tag, dependabot moves the pin
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # exactly what bun.lock says: a changed lockfile fails the build
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build-github-pages
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
