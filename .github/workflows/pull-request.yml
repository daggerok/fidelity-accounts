name: Pull request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.ref }}
  cancel-in-progress: true

# Pull requests only: main is built and deployed by github-pages.yml
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # a third-party action: pinned to the commit of its tag, dependabot moves the pin
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # exactly what bun.lock says: a changed lockfile fails the build
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build-github-pages
