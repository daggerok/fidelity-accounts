<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>fidelity-accounts</title>
    <script id="theme-boot">
      // No flash: set .dark before the first paint. Same logic as shared/theme (tests/theme-inline.test.ts)
      (function () {
        var m = 'system';
        try { var v = localStorage.getItem('fidelity-accounts-theme'); if (v === 'light' || v === 'dark' || v === 'system') m = v; } catch (e) {}
        var sys = false;
        try { sys = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
        var dark = m === 'system' ? sys : m === 'dark';
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.dataset.themeMode = m;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-200">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
